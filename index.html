  <title>Nexora — Dental FJL | ERP Odontológico</title>

    content="Sistema integral SaaS de gestión clínica odontológica, citas, odontograma digital y reportes contables." />

  <!-- Google Fonts: Plus Jakarta Sans (Amigable, Moderno, Alta Legibilidad) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <script>
    /* Evita parpadeos de tema blanco/oscuro antes del primer render */
    (function () {
      try {
        var t = localStorage.getItem('nexora-theme');
        if (!t) {
          t = (window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches) ? 'light' : 'dark';
        }
        document.documentElement.setAttribute('data-theme', t);
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
